<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<div class="login-container">
    <h1>Welcome Back</h1>

<!--    thymeleaf treats request parameter as arrays. Because http can have multiple parameters with same name-->
    <div th:if="${param.error}" th:with="errorMsg=${param.error[0]}">
        <div th:switch="${errorMsg}" class="error-message">
            <p th:case="'bad_credentials'">Invalid password. Please try again.</p>
            <p th:case="'user_not_found'">Email not found. Please try again.</p>
            <p th:case="'generic_error'">An unexpected error occurred. Please try again later.</p>
            <p th:case="*" th:text="${errorMsg}">Unknown error occurred.</p>
        </div>
    </div>
    <form th:action="@{/login}" th:method="post" id="loginForm">
        <div class="input-group">
            <input type="email" id="email" name="username" required placeholder=" ">
            <label for="email">Email</label>
        </div>
        <div class="input-group">
            <input type="password" id="password" name="password" required placeholder=" ">
            <label for="password">Password</label>
        </div>
        <button type="submit">Log In</button>
    </form>

    <div class="register-link">
        Don't have an account? <a th:href="@{/register}">Register here</a>
    </div>
</div>
<script th:src="@{/js/login.js}"></script>
</body>
</html>
