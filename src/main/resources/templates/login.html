<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<div class="login-container">
    <h1>Welcome Back</h1>

    <div th:if="${param.error == 'bad_credentials'}" class="error-message">
        <p>Invalid password. Please try again.</p>
    </div>
    <div th:if="${param.error == 'user_not_found'}" class="error-message">
        <p>Email not found. Please try again.</p>
    </div>
    <div th:if="${param.error == 'generic_error'}" class="error-message">
        <p>An unexpected error occurred. Please try again later.</p>
    </div>

    <form th:action="@{/login}" th:method="post" id="loginForm">
        <div class="input-group">
            <input type="email" id="email" name="username" required placeholder=" ">
            <label for="email">Email</label>
        </div>
        <div class="input-group">
            <input type="password" id="password" name="password" required placeholder=" ">
            <label for="password">Password</label>
        </div>
        <button type="submit">Log In</button>
    </form>

    <div class="register-link">
        Don't have an account? <a th:href="@{/register}">Register here</a>
    </div>
</div>
<script th:src="@{/js/login.js}"></script>
</body>
</html>
